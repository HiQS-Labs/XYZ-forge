<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1c2330; --muted: #6b7280;
    --line: #9aa4b2; --edge-label-bg: #f6f7f9; --border: #d8dee6;
    --group-bg: rgba(15, 23, 42, .035);
    /* Diagram-surface typeface, swapped live by the font picker script near
       the end of <body>. No @font-face / network fetch here on purpose: the
       skill's contract is a self-contained file (offline, file:// safe), so
       "Indie Flower" only resolves if the reader's system already has it
       installed; otherwise the stack degrades to common handwriting faces
       and finally the universal `cursive` generic family. Zero requests
       either way. */
    --swe-font: -apple-system, "Segoe UI", Roboto, sans-serif;
    --swe-font-scale: 1;
    /* Chrome (buttons, search, legend, the picker itself) stays on the
       system sans regardless of --swe-font: the picker must remain legible
       in the font it is offering to switch away from. */
    --swe-ui-font: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1c212b; --ink: #e6e9ef; --muted: #9aa4b2;
      --line: #5c6675; --edge-label-bg: #12151b; --border: #333c4a;
      --group-bg: rgba(255, 255, 255, .035);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink);
         font-family: var(--swe-font); line-height: 1.4;
         font-size: calc(14px * var(--swe-font-scale)); }

  .swe-canvas { position: relative; width: 100vw; height: 100vh;
                overflow: hidden; cursor: grab; }
  .swe-canvas.swe-grabbing { cursor: grabbing; }
  .swe-viewport { position: absolute; transform-origin: 0 0; }
  .swe-edges { position: absolute; overflow: visible; width: 1px; height: 1px; }
  .swe-nodes { position: absolute; }
  .swe-groups { position: absolute; }
  .swe-group-box { position: absolute; background: var(--group-bg);
                    border: 1px dashed var(--border); border-radius: 12px;
                    pointer-events: none; }
  .swe-group-label { position: absolute; top: 6px; left: 12px;
                      font-size: calc(10px * var(--swe-font-scale));
                      font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
                      color: var(--muted); pointer-events: none; }
  .swe-lane-box { position: absolute; background: var(--group-bg);
                  border: 1px solid var(--border); border-radius: 8px;
                  pointer-events: none; }
  .swe-lane-current { border-color: #4f7cff; }
  .swe-lane-label { position: absolute; left: 12px; top: 32px; width: 150px;
                    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
                    font-size: 11px; font-weight: 700; color: var(--muted); }

  .swe-node { position: absolute; background: var(--panel);
              border: 1px solid var(--border); border-radius: 8px;
              border-top: 3px solid var(--node-color, #6b7280);
              box-shadow: 0 1px 4px rgba(0,0,0,.12); cursor: move;
              user-select: none; transition: opacity .15s; }
  .swe-node-head { font-size: calc(9px * var(--swe-font-scale));
                   letter-spacing: .08em; font-weight: 700;
                   color: var(--node-color, #6b7280); padding: 6px 10px 0; }
  .swe-node-body { padding: 2px 10px 8px; }
  .swe-node-label { font-weight: 600; }
  .swe-node-tech { font-size: calc(11px * var(--swe-font-scale));
                    color: var(--muted); margin-top: 2px; }
  .swe-node-commit .swe-node-label { white-space: nowrap; overflow: hidden;
                                     text-overflow: ellipsis; }
  .swe-node.swe-dimmed { opacity: .22; }

  .swe-edge { fill: none; stroke: var(--line); stroke-width: 1.6;
              transition: opacity .15s; }
  .swe-arrow { fill: var(--line); }
  .swe-edge-branch { stroke: #00a5a5; }
  .swe-arrow-branch { fill: #00a5a5; }
  .swe-edge-merge { stroke: #9a5cff; stroke-width: 2; }
  .swe-arrow-merge { fill: #9a5cff; }
  .swe-edge-label { font-family: var(--swe-font);
                    font-size: calc(11px * var(--swe-font-scale));
                    fill: var(--muted); text-anchor: middle;
                    paint-order: stroke; stroke: var(--edge-label-bg);
                    stroke-width: 4px; }
  .swe-edge.swe-dimmed, .swe-edge-label.swe-dimmed { opacity: .12; }

  .swe-title { position: absolute; top: 14px; left: 18px;
               font-size: calc(16px * var(--swe-font-scale));
               font-weight: 700; pointer-events: none; }
  .swe-controls { position: absolute; bottom: 16px; left: 16px;
                  display: flex; flex-direction: column; gap: 4px; }
  .swe-btn { width: 30px; height: 30px; border: 1px solid var(--border);
             border-radius: 6px; background: var(--panel); color: var(--ink);
             font-family: var(--swe-ui-font); font-size: 15px; cursor: pointer; }
  .swe-btn:hover { border-color: var(--line); }
  .swe-legend { position: absolute; bottom: 16px; right: 16px;
                background: var(--panel); border: 1px solid var(--border);
                border-radius: 8px; padding: 8px 12px; display: flex;
                flex-wrap: wrap; gap: 10px; font-family: var(--swe-ui-font);
                font-size: 11px; color: var(--muted); max-width: 40vw; }
  .swe-legend-item { display: inline-flex; align-items: center; gap: 5px;
                     cursor: pointer; user-select: none; }
  .swe-legend-item.swe-dimmed { opacity: .35; }
  .swe-legend-dot { width: 9px; height: 9px; border-radius: 50%;
                    display: inline-block; }

  .swe-search { position: absolute; top: 14px; right: 16px;
                display: flex; align-items: center; gap: 6px; }
  .swe-search-input { width: 180px; padding: 6px 10px;
                       font-family: var(--swe-ui-font); font-size: 12px;
                       border: 1px solid var(--border); border-radius: 6px;
                       background: var(--panel); color: var(--ink); }
  .swe-search-input::placeholder { color: var(--muted); }
  .swe-search-clear { border: 1px solid var(--border); border-radius: 6px;
                       background: var(--panel); color: var(--muted);
                       width: 24px; height: 24px; cursor: pointer;
                       font-family: var(--swe-ui-font); font-size: 13px;
                       line-height: 1; display: none; }
  .swe-search-clear:hover { border-color: var(--line); color: var(--ink); }
  .swe-search.swe-search-active .swe-search-clear { display: block; }

  /* Font picker: injected by the script at the end of <body>, next to the
     search box (top-right cluster). Lives outside #diagram so it survives
     the re-render a font swap triggers (see script below), fixed-positioned
     so it tracks the viewport the same way .swe-search visually does. */
  .swe-font-select { position: fixed; top: 14px; right: 16px; z-index: 5;
                      padding: 6px 8px; font-family: var(--swe-ui-font);
                      font-size: 12px; border: 1px solid var(--border);
                      border-radius: 6px; background: var(--panel);
                      color: var(--ink); cursor: pointer; }
  .swe-font-select:hover { border-color: var(--line); }
</style>
</head>
<body>
<div id="diagram"></div>
<script>
__RENDERER_JS__
</script>
<script>
(function () {
  var spec = __DIAGRAM_JSON__;

  // Font stacks: no @font-face, no network fetch — "Indie Flower" resolves
  // only against a locally installed copy, then degrades through common
  // handwriting faces to the universal `cursive` generic family, so this
  // never blocks or silently fails when the diagram is opened offline.
  var FONTS = {
    'default': {
      label: 'Default',
      family: '-apple-system, "Segoe UI", Roboto, sans-serif',
      scale: 1
    },
    'indie-flower': {
      label: 'Indie Flower (handwriting)',
      family: '"Indie Flower", "Bradley Hand", "Segoe Print", "Comic Sans MS", cursive',
      // A handwriting face reads smaller than the system sans at the same
      // px size, so bump it slightly for legibility.
      scale: 1.15
    }
  };

  function applyFont(key) {
    var f = FONTS[key] || FONTS['default'];
    document.documentElement.style.setProperty('--swe-font', f.family);
    document.documentElement.style.setProperty('--swe-font-scale', f.scale);
  }

  function positionPicker() {
    var search = document.querySelector('#diagram .swe-search');
    picker.style.right = search ? (16 + search.offsetWidth + 8) + 'px' : '16px';
  }

  var picker = document.createElement('select');
  picker.className = 'swe-font-select';
  picker.title = 'Diagram typeface';
  Object.keys(FONTS).forEach(function (key) {
    var opt = document.createElement('option');
    opt.value = key;
    opt.textContent = FONTS[key].label;
    picker.appendChild(opt);
  });
  picker.addEventListener('change', function () {
    applyFont(picker.value);
    // Indie Flower's metrics differ from the system sans (wider glyphs,
    // taller ascenders), so node labels wrap differently and edge anchors
    // computed from the old heights would drift. Re-rendering from the same
    // spec re-measures every node height and redraws edges/groups against
    // the new font, the same way the initial render does.
    renderDiagram(spec);
    positionPicker();
  });
  // Appended to <body>, not #diagram: renderDiagram() clears #diagram's
  // contents on every call, and the picker must survive its own re-render.
  document.body.appendChild(picker);

  renderDiagram(spec);
  positionPicker();
  window.addEventListener('resize', positionPicker);
})();
</script>
</body>
</html>
