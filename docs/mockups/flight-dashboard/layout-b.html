<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flightdeck — Layout B / Focus</title>
<style>
:root{color-scheme:dark;--bg:#090d12;--ink:#ecf0f5;--muted:#96a2b1;--faint:#657386;--line:#2b3541;--green:#91d5b5;--red:#ec9b99;--amber:#e9c794;--gap:24px;--peek:clamp(44px,6vw,116px);--full:3;--width:calc((100vw - 2*var(--peek) - (var(--full) + 1)*var(--gap))/var(--full));font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 45%,#17202b 0,#0b1118 50%,#070a0f 100%);color:var(--ink);font-size:14px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}h1,h2,h3,p{margin:0}button,a{touch-action:manipulation}button{font:inherit}svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}a{color:inherit}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}.green{color:var(--green)}.red{color:var(--red)}.amber{color:var(--amber)}.gray{color:var(--muted)}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.close{position:fixed;z-index:5;right:25px;top:22px;display:grid;place-items:center;width:39px;height:39px;border:1px solid #38424d;border-radius:50%;color:#a8b4c3;background:#121922d9;text-decoration:none;transition:background .2s,color .2s}.close:hover{background:#293441;color:white}.close:focus-visible,.carousel:focus-visible{outline:2px solid #e9c29e;outline-offset:-5px}.close svg{width:15px;height:15px}
.carousel{height:100dvh;display:flex;align-items:center;gap:var(--gap);padding:72px calc(var(--peek) + var(--gap));overflow-x:auto;overflow-y:hidden;scrollbar-width:none;scroll-snap-type:x mandatory;scroll-padding-inline:calc(var(--peek) + var(--gap));overscroll-behavior-x:contain;touch-action:pan-x pan-y pinch-zoom;cursor:grab;mask-image:linear-gradient(to right,transparent 0,#000 var(--peek),#000 calc(100% - var(--peek)),transparent 100%);-webkit-mask-image:linear-gradient(to right,transparent 0,#000 var(--peek),#000 calc(100% - var(--peek)),transparent 100%)}.carousel::-webkit-scrollbar{display:none}.carousel.dragging{cursor:grabbing;scroll-snap-type:none;user-select:none}.card{width:var(--width);height:calc(100dvh - 144px);max-height:980px;flex:0 0 var(--width);scroll-snap-align:start;position:relative;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(150deg,color-mix(in srgb,var(--repo-color),#161d27 93%),#161d26 37%,#111820 100%);border:1px solid #35404d;border-radius:18px;box-shadow:0 24px 70px #0005;isolation:isolate}.card:before{position:absolute;content:"";width:200px;height:200px;right:-40px;top:-100px;background:radial-gradient(circle,color-mix(in srgb,var(--repo-color),transparent 83%),transparent 70%);pointer-events:none;z-index:-1}.card.has-waiting{border-color:#554346}.card.is-unknown{border-style:dashed;border-color:#39434d}.card-scroll{overflow-y:auto;overscroll-behavior-y:contain;scrollbar-width:thin;scrollbar-color:#384655 transparent;padding:28px 29px 20px;flex:1;min-height:0;cursor:inherit}.card-top{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:9px;letter-spacing:1.4px;text-transform:uppercase;color:var(--faint);font-weight:600;margin-bottom:26px}.position{letter-spacing:.8px;color:#8190a3}.repo-heading{display:flex;gap:13px;align-items:center}.repo-mark{width:42px;height:42px;flex:none;display:grid;place-items:center;border-radius:11px;font-size:12px;font-weight:650;color:var(--repo-color);background:color-mix(in srgb,var(--repo-color),transparent 91%);border:1px solid color-mix(in srgb,var(--repo-color),transparent 74%)}h1{font-size:29px;font-weight:540;letter-spacing:-1px;line-height:1.2}.intent{font-size:15px;line-height:1.6;color:#b5bfcc;margin:16px 0 13px;min-height:48px}.health{display:flex;align-items:center;gap:7px;font-size:11px;margin:0 0 23px}.health span:last-child{color:var(--faint);margin-left:auto;font-size:9px}.counts{display:flex;gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:15px 0;margin-bottom:23px}.count{flex:1;position:relative;padding-right:10px}.count+.count{padding-left:22px;border-left:1px solid var(--line)}.count b{font-size:29px;letter-spacing:-1px;line-height:1.25;font-weight:450;display:block}.count span{display:block;font-size:10px;color:var(--muted);margin-top:2px}.count:last-child b{color:#a6bdd3}.section-title{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:13px}.section-title h2{font-size:11px;font-weight:550;letter-spacing:.2px}.section-title span{font-size:9px;color:var(--faint)}.window{font-size:9px;color:var(--muted);letter-spacing:.3px;margin-bottom:12px}.activity-bars{display:flex;height:24px;align-items:flex-end;gap:4px;margin-bottom:5px}.activity-bars i{height:5px;background:#2c3846;flex:1;border-radius:2px;min-width:0}.activity-bars i.has-event{background:var(--repo-color);opacity:.78}.bar-labels{display:flex;justify-content:space-between;color:var(--faint);font-size:8px;margin-bottom:17px}.timeline{display:flex;flex-direction:column;gap:0;min-height:109px}.event{display:grid;grid-template-columns:35px 12px minmax(0,1fr);gap:9px;position:relative;padding:0 0 17px}.event time{color:#8191a4;font-size:9px;line-height:1.8}.event-rail{position:relative;padding-top:5px;color:var(--repo-color);display:flex;justify-content:center}.event:not(:last-child) .event-rail:after{position:absolute;content:"";width:1px;top:15px;bottom:-12px;background:#354351}.event .dot{width:5px;height:5px}.event-text{font-size:12px;line-height:1.45}.event-meta{font-size:10px;color:var(--muted);margin-top:3px}.no-events{border:1px dashed #36404b;border-radius:8px;padding:15px;color:var(--muted);font-size:11px;line-height:1.7;min-height:84px;margin-bottom:15px}.no-events b{font-weight:500;color:#ced5df;display:block;margin-bottom:4px}.issues{margin:20px 0 23px}.issue{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}.issue-number{font-size:11px;color:var(--repo-color);font-variant-numeric:tabular-nums;min-width:37px;line-height:1.6}.issue strong{display:block;font-size:12px;font-weight:450}.issue p{font-size:9px;color:var(--muted);margin-top:3px}.empty-issues{color:var(--faint);font-size:11px;border-top:1px solid var(--line);padding-top:11px}.attention{border:1px solid #564247;background:linear-gradient(110deg,#35272e66,#251d2500);border-radius:9px;padding:12px 13px;margin:0 0 23px}.attention-top{display:flex;align-items:center;gap:7px;font-size:10px;color:var(--red);margin-bottom:5px}.attention p{color:#b7a8b1;font-size:10px;line-height:1.6}.checkout-names{margin-top:9px;padding-top:2px}.checkout-names .section-title{margin-bottom:7px}.folder{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:9px;color:#8391a2;min-width:0}.folder svg{width:12px;height:12px;color:#627185}.folder-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.folder-type{margin-left:auto;color:#647487;font-size:8px;flex:none}.card-footer{padding:15px 29px;border-top:1px solid var(--line);background:#111820aa;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:9px;color:#7d8c9f}.pr-summary{display:flex;align-items:center;gap:7px;color:#b4bfd0}.pr-summary svg{width:12px;height:12px}.sample{font-size:8px;color:#6d7d90;letter-spacing:.4px;white-space:nowrap}
@media(min-width:1800px){.card-scroll{padding:30px 33px 23px}.card-footer{padding-left:33px;padding-right:33px}h1{font-size:32px}.intent{font-size:16px}.event-text,.issue strong{font-size:13px}.count b{font-size:32px}.count span{font-size:11px}.section-title h2{font-size:12px}.event-meta,.attention p{font-size:11px}.folder{font-size:10px}.card-top{margin-bottom:27px}}
@media(max-width:1199px){:root{--full:2;--gap:20px;--peek:54px}.card-scroll{padding:24px}.card-footer{padding:14px 24px}h1{font-size:27px}.carousel{padding-top:65px;padding-bottom:40px}.card{height:calc(100dvh - 105px)}}
@media(max-width:759px){:root{--full:1;--gap:14px;--peek:21px}.carousel{padding-top:65px;padding-bottom:24px}.card{height:calc(100dvh - 89px);border-radius:14px}.card-scroll{padding:22px}.card-top{margin-bottom:20px}.intent{font-size:14px;min-height:0}.counts{padding:13px 0}.count+.count{padding-left:16px}.count b{font-size:27px}.count span{font-size:9px}h1{font-size:26px}.repo-mark{height:35px;width:35px}.close{top:14px;right:17px;width:32px;height:32px}.card-footer{padding:12px 22px}.card-top{font-size:8px}.event-text,.issue strong{font-size:12px}.sample{font-size:7px}.health span:last-child{font-size:8px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<a class="close" href="layout-a.html" aria-label="Close focused view and return to Layout A"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></a>
<p id="instructions" class="sr-only">Layout B. Sample repository activity, not live telemetry. Swipe horizontally with touch or a trackpad, or drag with a mouse. Use left and right arrow keys, Home, or End. The close button returns to the saved Layout A.</p>
<main class="carousel" id="carousel" tabindex="0" aria-label="Focused repository cards" aria-describedby="instructions"></main>
<script src="demo-data.js"></script>
<script>
'use strict';
const carousel=document.getElementById('carousel');
const loadedAt=Date.now(),initialMinute=942;
let demoOffset=0;
const minuteNow=()=>initialMinute+Math.floor((Date.now()-loadedAt)/60000)+demoOffset;
const progressAge=l=>l.age===null?null:l.age+minuteNow()-initialMinute;
const ageLabel=n=>n===null?'unknown':n<60?`${n}m`:`${Math.floor(n/60)}h ${String(n%60).padStart(2,'0')}m`;
const timeLabel=n=>`${String(Math.floor(n/60)%24).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;
function repoEvents(r,now=minuteNow()){return progressEvents.filter(e=>e.repo===r.id).map(e=>({...e,laneInfo:r.lanes[e.lane],at:initialMinute-r.lanes[e.lane].age})).filter(e=>!e.laneInfo.unknown&&e.laneInfo.age!==null&&now-e.at>=0&&now-e.at<60).sort((a,b)=>b.at-a.at);}
function activeIssues(events){return [...new Map(events.map(e=>[e.laneInfo.issue,e])).values()];}
function health(r){const known=r.lanes.filter(l=>!l.unknown&&l.age!==null);const waiting=known.filter(l=>progressAge(l)>=120);const unknown=r.lanes.some(l=>l.unknown||l.age===null);const latest=known.length?Math.min(...known.map(progressAge)):null;return {waiting,unknown,latest,color:waiting.length?'red':unknown?'gray':latest>=60?'amber':'green',label:waiting.length?`${waiting.length} waiting lane${waiting.length===1?'':'s'}`:unknown?'Progress signal unknown':latest>=60?'Quiet this hour':'Recent progress'};}
function bars(r,events){const buckets=Array.from({length:12},(_,i)=>events.filter(e=>Math.floor((minuteNow()-e.at)/5)===11-i).length);return `<div class="activity-bars" role="img" aria-label="${events.length} recorded updates in the last hour; bars represent five-minute intervals">${buckets.map(n=>`<i class="${n?'has-event':''}" style="height:${n?Math.min(24,10+n*7):5}px"></i>`).join('')}</div><div class="bar-labels"><span>−60m</span><span>−30m</span><span>now</span></div>`;}
function activityMarkup(r,events){if(!events.length)return `<div class="no-events"><b>${health(r).unknown?'Activity unavailable':'No recorded progress in this hour'}</b>${health(r).unknown?'The last-hour feed is missing. This is not evidence of inactivity.':'This repo stays in view so a quiet lane does not get forgotten.'}</div>`;return `<div class="timeline">${events.map(e=>`<div class="event"><time class="mono">${timeLabel(e.at)}</time><span class="event-rail"><i class="dot"></i></span><div><p class="event-text">${esc(e.text)}</p><p class="event-meta">${e.laneInfo.agent} · ${ageLabel(minuteNow()-e.at)} ago</p></div></div>`).join('')}</div>`;}
function issueMarkup(r,events){const issues=activeIssues(events);return `<div class="section-title"><h2>Issues active this hour</h2><span>${health(r).unknown&&!events.length?'Unknown':issues.length+' linked'}</span></div>${issues.length?issues.map(e=>`<div class="issue"><span class="issue-number mono">#${e.laneInfo.issue}</span><div><strong>${esc(e.laneInfo.task)}</strong><p>${e.laneInfo.agent} · ${esc(e.laneInfo.basis)}</p></div></div>`).join(''):`<p class="empty-issues">${health(r).unknown?'Issue activity cannot be confirmed.':'No issues with recorded progress in this hour.'}</p>`}`;}
function waitingMarkup(r){const h=health(r);return h.waiting.map(l=>`<div class="attention"><div class="attention-top"><i class="dot"></i>Still waiting · ${ageLabel(progressAge(l))}</div><p>${l.agent} · #${l.issue} ${esc(l.task)}<br>${esc(l.next)}</p></div>`).join('');}
function card(r,index){const h=health(r),events=repoEvents(r),prs=r.prs||[],ready=prs.filter(p=>p.state==='ready').length,qa=prs.filter(p=>p.state==='qa').length;return `<article class="card ${h.waiting.length?'has-waiting':''} ${h.unknown?'is-unknown':''}" data-repo="${r.id}" style="--repo-color:${r.color}" aria-labelledby="title-${r.id}"><div class="card-scroll"><div class="card-top"><span>Flightdeck / Focus</span><span class="position mono">${String(index+1).padStart(2,'0')} / 07</span></div><div class="repo-heading"><span class="repo-mark">${r.initials}</span><h1 id="title-${r.id}">${r.name}</h1></div><p class="intent">${r.goal}</p><div class="health ${h.color}"><i class="dot"></i><span class="health-label">${h.label}</span><span class="latest-label">${h.latest===null?'No observation':'Latest '+ageLabel(h.latest)+' ago'}</span></div><div class="counts"><div class="count"><b>${String(r.clones.length).padStart(2,'0')}</b><span>full clones</span></div><div class="count"><b>${String(r.worktrees.length).padStart(2,'0')}</b><span>worktrees</span></div><div class="count"><b>${String(r.lanes.length).padStart(2,'0')}</b><span>agent lanes</span></div></div><section class="hour"><div class="section-title"><h2>Last hour</h2><span class="event-total">${h.unknown&&!events.length?'Data missing':events.length+' update'+(events.length===1?'':'s')}</span></div><p class="window mono">${timeLabel(minuteNow()-60)} — ${timeLabel(minuteNow())} PDT</p><div class="bars">${bars(r,events)}</div><div class="events">${activityMarkup(r,events)}</div></section><section class="issues">${issueMarkup(r,events)}</section><div class="waiting">${waitingMarkup(r)}</div><section class="checkout-names"><div class="section-title"><h2>Where the work lives</h2><span>${r.clones.length+r.worktrees.length} folders</span></div>${r.clones.map(n=>`<div class="folder">${icon('folder')}<span class="folder-name mono" title="${esc(n)}">${esc(n)}</span><span class="folder-type">CLONE</span></div>`).join('')}${r.worktrees.map(n=>`<div class="folder">${icon('folder')}<span class="folder-name mono" title="${esc(n)}">${esc(n)}</span><span class="folder-type">WORKTREE</span></div>`).join('')}</section></div><footer class="card-footer"><span class="pr-summary">${icon('pr')}${r.prs?`${ready} merge ready · ${qa} need QA`:'PR inventory unknown'}</span><span class="sample">LAYOUT B · SAMPLE DATA</span></footer></article>`;}
function updateActivity(){repos.forEach(r=>{const el=carousel.querySelector(`[data-repo="${r.id}"]`),events=repoEvents(r),h=health(r);el.classList.toggle('has-waiting',h.waiting.length>0);el.querySelector('.health').className='health '+h.color;el.querySelector('.health-label').textContent=h.label;el.querySelector('.latest-label').textContent=h.latest===null?'No observation':'Latest '+ageLabel(h.latest)+' ago';el.querySelector('.event-total').textContent=h.unknown&&!events.length?'Data missing':events.length+' update'+(events.length===1?'':'s');el.querySelector('.window').textContent=`${timeLabel(minuteNow()-60)} — ${timeLabel(minuteNow())} PDT`;el.querySelector('.bars').innerHTML=bars(r,events);el.querySelector('.events').innerHTML=activityMarkup(r,events);el.querySelector('.issues').innerHTML=issueMarkup(r,events);el.querySelector('.waiting').innerHTML=waitingMarkup(r);});}
carousel.innerHTML=repos.map(card).join('');
function step(){return carousel.querySelector('.card').getBoundingClientRect().width+parseFloat(getComputedStyle(carousel).gap);}
function moveTo(index,smooth=true){const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;carousel.scrollTo({left:Math.min(carousel.scrollWidth-carousel.clientWidth,Math.max(0,index)*step()),behavior:smooth&&!reduce?'smooth':'instant'});}
carousel.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const current=Math.round(carousel.scrollLeft/step());moveTo(e.key==='Home'?0:e.key==='End'?repos.length:current+(e.key==='ArrowRight'?1:-1));});
let drag=null;
carousel.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.button!==0)return;drag={x:e.clientX,left:carousel.scrollLeft,moved:false};carousel.setPointerCapture(e.pointerId);carousel.classList.add('dragging');e.preventDefault();});
carousel.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x;drag.moved ||= Math.abs(dx)>5;carousel.scrollLeft=drag.left-dx;});
function endDrag(){if(!drag)return;const index=Math.round(carousel.scrollLeft/step());drag=null;carousel.classList.remove('dragging');moveTo(index);}
carousel.addEventListener('pointerup',endDrag);carousel.addEventListener('pointercancel',endDrag);carousel.addEventListener('lostpointercapture',endDrag);
// Translate two parallel touch contacts; allow native pinch when their separation changes.
let multiTouch=null;
const touchPair=touches=>{const [a,b]=[...touches];return {x:(a.clientX+b.clientX)/2,y:(a.clientY+b.clientY)/2,distance:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)};};
carousel.addEventListener('touchstart',e=>{if(e.touches.length===2){multiTouch={...touchPair(e.touches),left:carousel.scrollLeft,claimed:false,pinch:false};}},{passive:true});
carousel.addEventListener('touchmove',e=>{if(!multiTouch||e.touches.length!==2)return;const pair=touchPair(e.touches),dx=pair.x-multiTouch.x,dy=pair.y-multiTouch.y;if(Math.abs(pair.distance-multiTouch.distance)>Math.max(8,multiTouch.distance*.06)){multiTouch.pinch=true;if(multiTouch.claimed)carousel.classList.remove('dragging');}if(multiTouch.pinch)return;if(Math.abs(dx)>6&&Math.abs(dx)>Math.abs(dy)&&e.cancelable){e.preventDefault();multiTouch.claimed=true;carousel.classList.add('dragging');carousel.scrollLeft=multiTouch.left-dx;}},{passive:false});
function endMultiTouch(e){if(multiTouch&&e.touches.length<2){const claimed=multiTouch.claimed&&!multiTouch.pinch;multiTouch=null;carousel.classList.remove('dragging');if(claimed)moveTo(Math.round(carousel.scrollLeft/step()));}}
carousel.addEventListener('touchend',endMultiTouch);carousel.addEventListener('touchcancel',endMultiTouch);
requestAnimationFrame(()=>moveTo(innerWidth>=760?1:0,false));
let lastMinute=minuteNow();setInterval(()=>{const now=minuteNow();if(now!==lastMinute){lastMinute=now;updateActivity();}},1000);
</script>
</body>
</html>
