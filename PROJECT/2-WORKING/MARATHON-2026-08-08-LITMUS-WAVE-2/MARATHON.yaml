# MARATHON.yaml — 2026-08-08: release 0.2.0 Litmus, SECOND wave.
#
# Wave 1 (MARATHON-2026-08-06-LITMUS) completed all four of its lanes and shipped as PRs #443
# and #445. This is the wave authored from what survived it.
#
# 3 sequential phases. Phases run STRICTLY ONE AT A TIME (GH-241) — `depends_on` constrains the
# order, it does not create it, and a disjoint write-set buys no parallelism here.
#
#   gh416 → gh401 → gh390
#
# OPERATOR GO GIVEN 2026-08-08 ("prepare docs, preflight and first dry-run the marathon for
# remainder of Litmus issues … and then run the marathon").
#
# PREFLIGHTED 2026-08-08 against `development`:
#
#   lane   verdict            acceptance fidelity                                   source-url
#   gh416  ready (exit 0)     match 5/5 verbatim                                    ok → issue #416
#   gh401  ready (exit 0)     match 5/5 verbatim                                    ok → issue #401
#   gh390  ready (exit 0)     match — 9 issue criteria, 15 declared deviations      ok → issue #390
#
# All three issues confirmed OPEN at preflight. Every fix_probe was ALSO re-checked by hand against
# the working tree, because preflight's `ref-probed` line resolved the local `development` branch,
# which is 9 commits behind `origin/development` while a concurrent session holds the root checkout.
# The six probe results are identical on both refs, so the verdicts stand — but they were verified,
# not assumed, which is the whole point of this release.
#
# ---------------------------------------------------------------------------------------
# THE SELECTION CONSTRAINT THAT DECIDED THIS WAVE
# ---------------------------------------------------------------------------------------
# Litmus is a release about the harness's own trustworthiness, so most of what remains is a change
# TO THE MACHINERY THE MARATHON ITSELF RUNS ON. That is not a coincidence, and it is a hard limit on
# what a marathon can build:
#
#   * A lane whose write-set includes `relay-automation/marathon.sh` edits the bash script that is
#     CURRENTLY EXECUTING the chain. bash reads a script by byte offset as it goes, so committing a
#     rewrite mid-run can corrupt the remainder of the run in a way that looks like anything but its
#     real cause.
#   * A lane whose write-set includes a turn shim (`utils/py/*-turn.py`) or the turn kernel
#     (`relay-automation/relay-turn-lib.sh`, `utils/py/rtl.py`) changes the code the NEXT turn runs.
#     A defect there wedges every subsequent phase, and the wedge presents as an unrelated failure.
#   * A lane whose write-set includes `bin/tick`'s claim semantics changes the coordination primitive
#     the driver uses between phases.
#
# `utils/py/swarm_preflight.py` (wave 1's shared write-set) is safe by comparison: nothing in a
# running marathon executes it. `utils/py/marathon_drive.py` is safe *conditionally* — it is Python,
# so a running process already holds its bytecode and only the NEXT phase's fresh interpreter sees a
# change — which is why the two lanes that touch it are ordered by how far their change sits from the
# live path.
#
# Preflight does not enforce this. It classifies artifacts into `kernel` / `shim` / `independent`
# zones (`utils/py/swarm_preflight.py`), but the zone only drives `skip_branch_prompt` — it never
# affects READY. So this is an authoring-time judgement, recorded here so the next author does not
# have to rediscover it.
#
# ---------------------------------------------------------------------------------------
# WHY FULLY SEQUENTIAL
# ---------------------------------------------------------------------------------------
# Write-sets, taken from each capture doc's `## Swarm Preflight Contract` artifacts list:
#   gh416: PROJECT/PDDA-SYNC-POLICY.md, AGENTS.md
#   gh401: utils/py/marathon_drive.py, test/gh268-relay-cue-and-target-checks.sh,
#          test/marathon-root-audit.sh, test/gh401-dry-run-no-mutation.sh, validate.sh
#   gh390: utils/py/marathon_drive.py, test/gh390-gate-guard.sh, validate.sh
#
# Two collisions make concurrency unsafe regardless of what a planner would compute:
#   1. `validate.sh` is in both build lanes' write-sets — each must REGISTER its new or changed test
#      in the TESTS=() array (validate.sh does not glob test/). Sequential execution makes it safe.
#      Same constraint the 2026-07-27 and 2026-08-06 marathons documented.
#   2. `utils/py/marathon_drive.py` is in BOTH gh401 and gh390. They are adjacent and ordered so the
#      file has exactly one owner at a time and gh390 rebases on gh401's landed state.
#
# ---------------------------------------------------------------------------------------
# WHY THIS ORDER
# ---------------------------------------------------------------------------------------
#   * gh416 FIRST because it is the only lane in this marathon whose write-set cannot affect the
#     marathon running it — two documents, nothing executed. It is also the smallest (cx/risk/eff
#     1/1/2, one phase, four of five acceptance criteria already shipped in PR #413), so if the
#     chain is going to fail for an environmental reason it fails on the cheapest lane.
#   * gh401 SECOND. It edits `utils/py/marathon_drive.py`, but only the `--dry-run` path — which a
#     real run never takes. So the blast radius on the phase after it is as close to zero as a
#     driver change gets. Its brief says this explicitly and tells the builder not to refactor
#     shared helpers on the live path to tidy the dry-run path.
#   * gh390 LAST because it changes the PRE-ADVANCE GATE PATH itself — lifting the guard helpers out
#     of `main()` so the signal→verdict mapping gets a seam. If that refactor breaks the gate, the
#     failure lands on gh390's own gate and nothing downstream. That containment is the entire
#     reason for the position, and the brief warns the builder that a broken guard here presents as
#     `pre-advance-failed`, which is #407's exact mislabel.
#
# ---------------------------------------------------------------------------------------
# SELECTION NOTES (what was considered and deliberately left out)
# ---------------------------------------------------------------------------------------
# The Litmus milestone had 17 open issues when this wave was authored. Six were closed as already
# shipped (#343, #418, #419, #425, #441 by wave 1; #344 was fixed by PR #364 and regression-pinned by
# `test/gh369-find-doc-root-resolution.sh` case 6 long before this wave). Of the remaining eleven:
#
#   * #388 (marathon run-log durability) — READY, 7/7 acceptance verbatim, genuinely wanted. EXCLUDED
#     because its write-set names `relay-automation/marathon.sh`, the outer driver that would be
#     executing the chain. This is the self-modification constraint above, in its sharpest form. It
#     needs a direct PR or a single hand-driven relay, not a marathon phase.
#   * #375 (agy auth pre-flight) — READY, risk 1, but its write-set is `utils/py/agy-turn.py` and agy
#     is the REVIEWER for every phase in this marathon. A stricter auth probe that misfires would
#     fail every subsequent review. Compounding it: the probe was observed failing in BOTH directions
#     on 2026-08-07 — `agy whoami` errors identically whether auth is valid or expired — so the fix
#     as specified may not be verifiable at all. That is an investigation, not a timed build lane.
#   * #426 (worktree isolation leak) — READY, 4/4 verbatim, and a true blocker per #431. EXCLUDED on
#     write-set: `relay-automation/relay-turn-lib.sh` is the turn kernel, sourced fresh by every
#     turn. Wave 1 also flagged it as "0.5-2d, cause unknown", and unknown-cause investigation is
#     the wrong shape for an unattended lane. Still collides with #417.
#   * #408 + #409 (leaked tick claim, discarded stderr) — now captured as ONE combined lane in
#     `PROJECT/2-WORKING/GH-409-408-TOKEN-FAILURE-VISIBILITY.md` (renamed 2026-08-08 so the
#     `GH-409-*.md` lookup finds it; preflight had been reporting BLOCKED: no capture doc). EXCLUDED
#     because the lane's own deliverables are `utils/py/rtl.py`, the five turn shims, and making
#     `tick claim` exit non-zero — i.e. the claim/handoff primitive the driver uses between phases.
#     A defect there wedges the run, and the lane exists precisely BECAUSE a wedge of that kind is
#     near-undiagnosable. It needs its own run where a wedge costs nothing else. Still needs a
#     preflight contract.
#   * #416 was previously excluded ("a policy document is better served by a direct PR than by a
#     build→review lane"). That call is REVERSED here, on the ground that it is the one remaining
#     lane with zero risk to the chain and a reviewer pass on a policy document has real value.
#   * #401 and #388 were previously deferred as "Nightwatch's theme (survives, records, recovers)
#     rather than Litmus's". That deferral is REVERSED for #401: both are on the Litmus MILESTONE,
#     and a release cannot ship with open milestone issues on the grounds that they feel like the
#     next release's theme. #388 stays out for the write-set reason above, not the theme reason.
#   * #417 (turn-ROOT resolution) — unchanged from wave 1. The tree asserts both that
#     `rev-parse --show-toplevel` is the correct default AND that it is the bug caught live, with no
#     test able to distinguish them. That is a decision, not a build lane. Collides with #426.
#   * #358 (CI lock-flake instrumentation) — unchanged from wave 1. Edits
#     `.github/workflows/ci.yml`; changing CI from inside an unattended marathon is a risk this
#     release does not need to take.
#   * #407 (`pre-advance-failed` reported where the gate never ran) — no capture doc, so not
#     preflightable (GUIDING-PRINCIPLES §11). Criterion 6 of the #409+#408 lane covers it or
#     explicitly defers to it; it should be settled there rather than given a doc of its own.
#
# So four of the eleven survivors are excluded on the self-modification constraint, two are excluded
# as decisions or investigations rather than builds, one edits CI, one has no doc, and three are the
# lanes below. That is the honest shape of the remainder, and it means the Litmus milestone cannot be
# closed by marathons alone.
#
# Builder defaults to codex (GH-212, subscription-billed). Reviewer is agy throughout so the reviewer
# is never the model that wrote the change.
#
# Parent capture docs (one per phase):
#   PROJECT/2-WORKING/GH-416-PDDA-SYNC-DELETED-GUARDRAILS.md
#   PROJECT/2-WORKING/GH-401-DRY-RUN-MUTATES-REPO.md
#   PROJECT/2-WORKING/GH-390-GATE-GUARD-COVERAGE.md

name: litmus-wave-2-2026-08-08
phases:
  - id: gh416-pdda-sync-policy
    name: "GH-416: a stated review policy for the next dependency sync — criterion 5, the only one PR #413 left open"
    reviewer: agy
    brief: PROJECT/2-WORKING/MARATHON-2026-08-08-LITMUS-WAVE-2/brief-gh416-pdda-sync-policy.md
    artifact: PROJECT/PDDA-SYNC-POLICY.md,AGENTS.md
    turn_timeout_s: 900
    max_review_rounds: 3

  - id: gh401-dry-run-no-mutation
    # NOTE: no ' #NNN' in a phase name — bin/marathon-yaml strips from a space-hash onward even
    # inside a double-quoted scalar, which silently truncated a wave-1 name and left the quote open.
    name: "GH-401: a dry run must not write into a repo it was not pointed at, and the audit must catch the next one"
    reviewer: agy
    depends_on: gh416-pdda-sync-policy
    brief: PROJECT/2-WORKING/MARATHON-2026-08-08-LITMUS-WAVE-2/brief-gh401-dry-run-no-mutation.md
    artifact: utils/py/marathon_drive.py,test/gh268-relay-cue-and-target-checks.sh,test/marathon-root-audit.sh,test/gh401-dry-run-no-mutation.sh,validate.sh
    turn_timeout_s: 900
    max_review_rounds: 3

  - id: gh390-gate-guard-coverage
    name: "GH-390 remainder: make BOTH gate-guard attribution branches observable on one machine, and record the kill"
    reviewer: agy
    depends_on: gh401-dry-run-no-mutation
    brief: PROJECT/2-WORKING/MARATHON-2026-08-08-LITMUS-WAVE-2/brief-gh390-gate-guard-coverage.md
    artifact: utils/py/marathon_drive.py,test/gh390-gate-guard.sh,validate.sh
    turn_timeout_s: 900
    max_review_rounds: 3
