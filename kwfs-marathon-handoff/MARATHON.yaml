# MARATHON.yaml — KISS-woo-fast-search bug-fix batch (gate-verifiable subset)
#
# Place this file + phases-briefs/ at the ROOT of the PLUGIN repo (KISS-woo-fast-search),
# alongside the gate the maintainer already built (tests/run.sh, tests/gate.php,
# tests/HUMAN-VERIFY.md). Run it from the plugin repo with the xyz harness pathed in via env
# (this is how a FOREIGN repo becomes the marathon ROOT without marathon.sh needing --target-root):
#
#   cd <plugin-repo>
#   MARATHON_ROOT="$PWD" \
#   MARATHON_DRIVE="<xyz>/relay-automation/marathon-drive.sh" \
#   MARATHON_YAML_BIN="<xyz>/bin/marathon-yaml" \
#   TICK_BIN="<xyz>/bin/tick" \
#   bash "<xyz>/relay-automation/marathon.sh" --plan MARATHON.yaml --dry-run   # smoke first
#
# Only the four phases whose acceptance the no-DB gate (`bash tests/run.sh`) can actually verify
# run here. #73 (coupon rebuild), #76 (analytics path), #75 wiring/invalidation, and #69 value
# correctness are NOT in this plan — they need production-scale data and stay in HUMAN-VERIFY.md.
#
# The gate is holistic and starts red. This marathon flips #68/#70/#71/#72 green; the #75 key-method
# invariant stays RED until the human checkpoint builds it. So after a clean run the gate reads
# "INVARIANTS: 4 passed, 1 failed · GATE: FAIL" — that residual red IS the human-checkpoint tracker,
# not a marathon failure. Judge marathon success by phase.approved events, not by GATE: PASS.

name: kwfs-bugfix-gate-verifiable
phases:
  - id: kwfs72
    name: "#72 — remove stale README/AUDIT.md security warnings"
    reviewer: agy
    brief: phases-briefs/kwfs72-docs.md
    artifact: README.md,AUDIT.md
    max_review_rounds: 1

  - id: kwfs71
    name: "#71 — exclude process artifacts from the dist build"
    reviewer: agy
    brief: phases-briefs/kwfs71-packaging.md
    artifact: .distignore
    max_review_rounds: 1

  - id: kwfs68
    name: "#68 — route HPOS edit URLs through get_edit_url at the call site"
    reviewer: codex
    brief: phases-briefs/kwfs68-hpos-url.md
    artifact: includes/class-kiss-woo-search.php
    max_review_rounds: 2

  - id: kwfs70
    name: "#70 — converge the order formatters on one key contract"
    reviewer: codex
    brief: phases-briefs/kwfs70-formatter.md
    artifact: includes/class-kiss-woo-search.php,includes/class-kiss-woo-order-formatter.php,admin/kiss-woo-admin.js
    depends_on: kwfs68
    max_review_rounds: 3
