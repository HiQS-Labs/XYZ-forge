name: Test admission

on:
  pull_request_target:
    branches: [development]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to inspect using trusted development code
        required: true
        type: string

permissions:
  contents: read

jobs:
  admission:
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      # Never checkout a PR head with this privileged token. Read its Git objects only.
      - uses: actions/checkout@v7
        with:
          ref: development
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the complete proposed change and publish exact-head check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
        run: >-
          python3 utils/py/gate_inventory.py admission hosted
          --pr "$PR_NUMBER" --output "$RUNNER_TEMP/test-admission-catalog.json"
      - uses: actions/upload-artifact@v4
        with:
          name: test-admission-catalog
          path: ${{ runner.temp }}/test-admission-catalog.json
          if-no-files-found: error
