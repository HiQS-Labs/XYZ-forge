# Canary tier (GH-928) — DORMANT by design until the tier is accepted.
# This workflow fires only on manual dispatch. Before arming, decide the PLATFORM question
# first (GLM r2 S5): macOS is the shipping platform (GH-509) and hosted ubuntu is
# advisory-only, so when arming EITHER switch runs-on to macos-latest, OR keep ubuntu-latest
# and add `continue-on-error: true` to the job (advisory, never breakage), OR record an
# explicit operator decision to deviate. Arming itself = adding the triggers under `on:`:
#
#   push:
#     branches: [development, main]
#   pull_request:
#
# nothing else changes. ./canary.sh is the whole job. NOTE (GLM r2 S1): the workflow is not
# dispatchable until this file exists on a default-branch ref — after the cherry-pick lands,
# dispatch once and cite that run before any arming decision.
name: Canary tier

on:
  workflow_dispatch:

concurrency:
  group: canary-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: canary (both runtimes)
        run: ./canary.sh --runtime both
        env:
          # 21 checks x the 60s default could exceed this job's 5-minute cap if several hang
          # (GLM r2 nit); 10s per check keeps the failure summary reachable.
          XYZ_CANARY_TIMEOUT_S: '10'
