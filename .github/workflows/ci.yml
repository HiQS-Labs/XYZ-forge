name: CI

# GH-216 cut `development` as the WIP branch that all work targets, but these
# triggers stayed pinned to `main` — so no PR into `development` ran CI at all.
# Both branches are gated here; add any future long-lived integration branch too.
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

jobs:
  tier1:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          set -euo pipefail
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck --version
          else
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi

      - name: Shellcheck tracked shell scripts
        run: |
          set -euo pipefail
          # Start at severity=error so Tier 1 lands green; tighten later once the backlog is burned down.
          git ls-files -- '*.sh' | while IFS= read -r file; do
            [ -n "$file" ] || continue
            shellcheck -S error "$file"
          done

      - name: Bash syntax check tracked shell scripts
        run: |
          set -euo pipefail
          git ls-files -- '*.sh' | while IFS= read -r file; do
            [ -n "$file" ] || continue
            bash -n "$file"
          done

      - name: Node syntax check tracked JavaScript
        run: |
          set -euo pipefail
          git ls-files -- 'src/*.js' 'bin/*.js' | while IFS= read -r file; do
            [ -n "$file" ] || continue
            node --check "$file"
          done

      - name: Validate .claude/settings JSON
        run: |
          set -euo pipefail
          git ls-files -- '.claude/settings*.json' | while IFS= read -r file; do
            [ -n "$file" ] || continue
            python3 -m json.tool "$file" >/dev/null
          done

      - name: Run PDDA deterministic gate
        run: |
          set -euo pipefail
          utils/pdda/pdda.sh run

      # GH-230: prove the README Quickstart's npm-dependency path works from a fresh
      # clone, so a missing-install-step regression fails here instead of on a
      # newcomer's machine.
      - name: Install npm dependencies and run acorn-extract test
        run: |
          set -euo pipefail
          npm ci
          bash test/acorn-extract.sh

      # GH-232: the acting-agent's user/keychain config and default `git init` branch name are
      # macOS-dev-machine assumptions baked into several fixture-driven tests (e.g. archive-writers.sh,
      # xyz-vendor.sh do a bare `git init` and expect the resulting branch to be "main"). ubuntu-latest's
      # git has no global identity and may default new repos to a non-"main" branch, so prepare both
      # here rather than touch the tests themselves (out of scope for this lane).
      - name: Prepare git environment for fixture-driven tests
        run: |
          set -euo pipefail
          git config --global init.defaultBranch main
          git config --global user.email "ci@runner.invalid"
          git config --global user.name "CI Runner"

      # GH-232: PR #231 ran the full ./validate.sh suite on ubuntu-latest for the first time and
      # found ~12 failures, assumed to be Ubuntu-environment-only and scoped out of CI. Re-diagnosed
      # directly against a real ubuntu:latest container (not guessed at from macOS): almost all were
      # masked by two things, now both fixed — (1) marathon.sh/marathon-drive.sh (and dependents
      # debug-mantra.sh/driver-lock.sh) used a BSD-only `sed -i ''` invocation that mis-parses under
      # GNU sed; (2) driver-lock.sh/xyz-harness-hooks.sh stubbed CLAUDE_BIN/AGY_BIN but not
      # CODEX_BIN — the actual default builder — so they only "passed" locally because a real `codex`
      # binary happened to be on the developer's own PATH, masking the gap; ubuntu CI has no such
      # binary. path-integrity.sh/archive-writers.sh/relay-file-seeding-visibility.sh/xyz-vendor.sh/
      # hq.sh/relay-pkg-freshness.sh all passed cleanly once re-tested for real — no ubuntu-specific
      # bug in any of them. Only registry-lock-concurrency.sh (GH-72, a documented 16-concurrent-writer
      # lock-contention flake under CI load, unrelated to this issue) stays skipped.
      - name: Run validate.sh suite (minus a documented flaky test)
        env:
          RELAY_SELF_SUFFICIENCY_SKIP: "1"
        run: |
          set -euo pipefail
          SKIP_TESTS=(
            "acorn-extract.sh"                    # already run above (needs npm ci first)
            "registry-lock-concurrency.sh"          # GH-72/GH-232: flaky under CI load (16 concurrent tick writers → lock contention / lost row); passes locally, flaked 3 runs across PRs #257/#259
          )
          ALL_TESTS=()
          while IFS= read -r line; do
            [ -n "$line" ] && ALL_TESTS+=("$line")
          done < <(sed -n '/^TESTS=(/,/^)/p' validate.sh | grep -oE '"[^"]+\.sh"' | tr -d '"')
          FAILED=0
          for t in "${ALL_TESTS[@]}"; do
            skip=0
            for s in "${SKIP_TESTS[@]}"; do
              [ "$t" = "$s" ] && { skip=1; break; }
            done
            if [ "$skip" -eq 1 ]; then
              echo "SKIP (GH-232): $t"
              continue
            fi
            echo "=== $t ==="
            bash "test/$t" || FAILED=1
          done
          exit "$FAILED"
