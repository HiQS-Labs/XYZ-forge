name: Wave reconciliation

on:
  pull_request:
    types: [closed]
    branches: [development]
  workflow_dispatch:
  # Recover missed close events from committed lifecycle state, including queue overflow.
  schedule:
    - cron: '23 */6 * * *'

concurrency:
  group: wave-reconcile
  cancel-in-progress: false
  # Supported since 2026-05-07; retain up to 100 pending runs instead of replacing one.
  # https://github.blog/changelog/2026-05-07-github-actions-concurrency-groups-now-allow-larger-queues/
  queue: max

permissions:
  contents: read

jobs:
  reconcile:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'development')
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: write
      issues: write   # GH-684: the final step opens/closes the one hosted-reconcile-attention issue
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - name: Check direct-push prerequisite
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # development was unprotected when implemented. Fail before writes if that changes;
          # a protected branch needs a reviewed bot-bypass policy, never an implicit bypass.
          test "$(gh api "repos/$REPO/branches/development" --jq .protected)" = false
      - name: Install runtime dependencies
        run: npm ci
      - name: Install Python dependencies for complete qualification
        run: python3 -m pip install --quiet --break-system-packages pytest requests PyYAML
      - name: Reconcile merged PR or catch up
        id: reconcile
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # GH-684: the log is tee'd OUTSIDE the tree ($RUNNER_TEMP) — the commit step below refuses
        # undeclared in-tree files — and stderr is folded in because the terminal
        # `wave-reconcile: ERROR — …` line is written there. pipefail keeps the reconciler's exit.
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = pull_request ]; then
            python3 utils/py/wave_reconcile.py --pr "$PR_NUMBER" --catch-up --gate --qualify 2>&1 | tee "$RUNNER_TEMP/reconcile.log"
          else
            python3 utils/py/wave_reconcile.py --catch-up --gate --qualify 2>&1 | tee "$RUNNER_TEMP/reconcile.log"
          fi
      - name: Commit declared artifacts and push
        shell: python3 {0}
        run: |
          import os
          import re
          import subprocess

          def git(*args):
              return subprocess.check_output(['git', *args])

          # Include both sides of doc moves; --no-renames makes the deletions explicit.
          changed = set(filter(None, git('diff', '--name-only', '--no-renames', '-z', 'HEAD').split(b'\0')))
          changed.update(filter(None, git('ls-files', '--others', '--exclude-standard', '-z').split(b'\0')))
          exact = {'releases.db', 'releases.sql', 'ROADMAP.md',
                   'RELEASES-PREVIEW.html', 'LEADERBOARD.html', 'LEADERBOARD.md'}
          # GH-721: 1-INBOX is the deletion side of a closed-issue capture promotion (GH-698 item 2);
          # keep this alternation equal to wave_reconcile.RECONCILE_FOLDERS plus the two destinations.
          doc = r'PROJECT/(?:1-INBOX|2-WORKING|3-COMPLETED|4-MISC)/(?:GH-)?[0-9]+-[^/]+\.md'
          plan = r'(?:PROJECT/2-WORKING/)?MARATHON-PLAN-[0-9]{4}-[0-9]{2}-[0-9]{2}\.md'
          receipt = r'TESTS-RESULTS/[0-9]{4}-[0-9]{2}-[0-9]{2}\+GH-591/wave-[0-9a-f]{40}/(?:provenance|validation)\.jsonl'
          paths = sorted(os.fsdecode(path) for path in changed)
          unexpected = [p for p in paths if p not in exact and not re.fullmatch(doc, p) and not re.fullmatch(plan, p) and not re.fullmatch(receipt, p)]
          if unexpected:
              raise SystemExit('Refusing undeclared reconciliation artifacts: ' + repr(unexpected))
          if not paths:
              print('Nothing to commit')
              raise SystemExit(0)
          # Explicit paths only; a downstream generator cannot widen the bot commit.
          git('add', '-A', '--', *paths)
          git('config', 'user.name', 'github-actions[bot]')
          git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          git('commit', '-m', 'chore: reconcile merged development work')
          # One fast-forward push; never rebase a generated SQLite DB or force-push.
          # A concurrent merge rejects this push and fails the job. The next scheduled/manual
          # catch-up starts from fresh development and recomputes the unlanded transitions.
          git('push', 'origin', 'HEAD:development')
      - name: Report hosted lane
        # GH-684: always runs, after the job's status is known. `job.status` reflects every preceding
        # step — a successful reconcile followed by a rejected fast-forward push is still red here.
        # One labelled issue is opened/commented on red or on any skipped backlog item, and closed
        # on the next green run with no skips. See utils/py/hosted_lane_report.py.
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 utils/py/hosted_lane_report.py --status "${{ job.status }}" --log "$RUNNER_TEMP/reconcile.log" --run-url "$RUN_URL"
