name: Wave reconciliation

on:
  pull_request:
    types: [closed]
    branches: [development]
  workflow_dispatch:
  # Recover missed close events from committed lifecycle state, including queue overflow.
  schedule:
    - cron: '23 */6 * * *'

concurrency:
  group: wave-reconcile
  cancel-in-progress: false
  # Supported since 2026-05-07; retain up to 100 pending runs instead of replacing one.
  # https://github.blog/changelog/2026-05-07-github-actions-concurrency-groups-now-allow-larger-queues/
  queue: max

permissions:
  contents: read

jobs:
  reconcile:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'development')
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: write
      issues: write   # GH-684: the final step opens/closes the one hosted-reconcile-attention issue
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: development
          fetch-depth: 0
      - name: Resolve protected publication and pending review
        id: publication
        env:
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY_PREFLIGHT'
          import json, os, sys
          sys.path.insert(0, 'utils/py')
          from test_admission import gh
          from hosted_lane_publish import pending_publication, publication_landing
          repo = os.environ['REPO']
          protected = gh(f'repos/{repo}/branches/development')['protected']
          pending = pending_publication(repo) if protected else []
          event = json.load(open(os.environ['GITHUB_EVENT_PATH']))
          own = publication_landing('.', event.get('pull_request', {}))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'pending={str(bool(pending)).lower()}\n')
              f.write(f'protected={str(protected).lower()}\n')
              f.write(f'own={str(own).lower()}\n')
          if pending:
              print('Qualification paused while reconciliation PR awaits operator review:', pending[0]['html_url'])
          PY_PREFLIGHT
      - name: Install runtime dependencies
        if: steps.publication.outputs.pending != 'true'
        run: npm ci
      - name: Install Python dependencies for complete qualification
        if: steps.publication.outputs.pending != 'true'
        run: python3 -m pip install --quiet --break-system-packages pytest requests PyYAML
      - name: Reconcile merged PR or catch up
        if: steps.publication.outputs.pending != 'true'
        id: reconcile
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OWN_PUBLICATION: ${{ steps.publication.outputs.own }}
        # GH-684: the log is tee'd OUTSIDE the tree ($RUNNER_TEMP) — the commit step below refuses
        # undeclared in-tree files — and stderr is folded in because the terminal
        # `wave-reconcile: ERROR — …` line is written there. pipefail keeps the reconciler's exit.
        # GH-740: the argv is built once and exported as RECONCILE_ARGS so the publish step's one
        # bounded recompute re-runs exactly this command (plus --only-receipted --skip-pull).
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = pull_request ] && [ "$OWN_PUBLICATION" != true ]; then
            ARGS=(--pr "$PR_NUMBER" --catch-up --gate --qualify)
          else
            ARGS=(--catch-up --gate --qualify)
          fi
          echo "RECONCILE_ARGS=${ARGS[*]}" >> "$GITHUB_ENV"
          python3 utils/py/wave_reconcile.py "${ARGS[@]}" 2>&1 | tee "$RUNNER_TEMP/reconcile.log"
      - name: Commit declared artifacts and push
        if: steps.publication.outputs.pending != 'true'
        id: publish
        env:
          PROTECTED: ${{ steps.publication.outputs.protected }}
        # GH-740: utils/py/hosted_lane_publish.py — the former inline step, moved so it can be tested
        # and retried. Same allowlist, explicit `git add`, bot identity, one fast-forward push; on a
        # rejected push it discards the stale commit, lifts only the receipt files onto the fresh
        # head, publishes them, and recomputes the transitions once with --only-receipted (which can
        # never run the suite). Never rebases a generated SQLite DB, never force-pushes. Its log is
        # tee'd for the report step (GH-741).
        run: |
          set -euo pipefail
          EXTRA=()
          [ "$PROTECTED" != true ] || EXTRA=(--protected)
          python3 utils/py/hosted_lane_publish.py --reconcile-args "$RECONCILE_ARGS" "${EXTRA[@]}" 2>&1 | tee "$RUNNER_TEMP/publish.log"
      - name: Report hosted lane
        # GH-684: always runs, after the job's status is known. `job.status` reflects every preceding
        # step — a successful reconcile followed by a rejected fast-forward push is still red here.
        # One labelled issue is opened/commented on red or on any skipped backlog item, and closed
        # on the next green run with no skips. See utils/py/hosted_lane_report.py.
        # GH-741: the step outcomes decide WHICH log's error is the cause — a green reconcile step's
        # log is full of the test suite's own expected ERROR lines and must never be blamed.
        if: always() && steps.publication.outputs.pending != 'true'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python3 utils/py/hosted_lane_report.py --status "${{ job.status }}" --log "$RUNNER_TEMP/reconcile.log"
          --run-url "$RUN_URL" --reconcile-outcome "${{ steps.reconcile.outcome }}"
          --publish-outcome "${{ steps.publish.outcome }}" --publish-log "$RUNNER_TEMP/publish.log"
