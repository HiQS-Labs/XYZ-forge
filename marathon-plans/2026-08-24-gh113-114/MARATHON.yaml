# Marathon: Bulkhead exit-gate closers — the last two open core-seven members (#113 #114).
# Run with:  relay-automation/marathon.sh --plan marathon-plans/2026-08-24-gh113-114/MARATHON.yaml
# Lanes are SERIALIZED via depends_on: both write utils/py/agy-turn.py (shared write-set).
# Reviewer is agy (marathon-yaml only accepts codex|gemini|agy ids; no commandcode shim wiring).
# Known risk: an agy reviewer can hit the very #114 idle-hang being fixed; the 300s idle
# watchdog + lane retry (exit 7 -> retry, park after LANE_MAX_ATTEMPTS) contain it. Builder codex.
# Both capture docs preflighted ready (swarm-preflight --dry-run exit 0, 2026-08-24, after the
# GH-425 source-repo sync committed alongside this plan).
# When both lanes land: Bulkhead's exit criterion is 7/7 — run the ship flow, not more scope.

name: gh113-114-bulkhead-exit-gate
phases:
  - id: gh113-headless-scratch
    name: "GH-113: sanctioned per-turn scratch lane + soft-landing relocation for root scratch files (exit 6 kept for tracked off-lane edits)"
    reviewer: agy
    brief: marathon-plans/2026-08-24-gh113-114/brief-gh113-headless-scratch.md
    artifact: utils/py/agy-turn.py,utils/py/marathon_drive.py,test/gh113-headless-scratch.sh,validate.sh
    max_review_rounds: 3

  - id: gh114-headless-tty
    name: "GH-114: force fully-headless agy invocation (no /dev/tty) + idle-kill attribution block"
    reviewer: agy
    brief: marathon-plans/2026-08-24-gh113-114/brief-gh114-headless-tty.md
    artifact: utils/py/agy-turn.py,test/gh114-headless-tty.sh,validate.sh
    depends_on: gh113-headless-scratch
    max_review_rounds: 3
