name: Verify standalone distribution

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  canonical-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check recorded XYZ-forge revision and managed byte parity
        shell: bash
        run: |
          revision="$(sed -n 's/^source_sha=//p' .xyz-forge-revision)"
          git clone --filter=blob:none https://github.com/HiQS-Labs/XYZ-forge.git "$RUNNER_TEMP/XYZ-forge"
          git -C "$RUNNER_TEMP/XYZ-forge" fetch --depth=1 origin "$revision"
          git -C "$RUNNER_TEMP/XYZ-forge" checkout --detach "$revision"
          python3 "$RUNNER_TEMP/XYZ-forge/utils/py/xyz_mini_sync.py" \
            --target agent-chorus --dest "$GITHUB_WORKSPACE" --check
      - name: Run standalone smoke suite
        working-directory: skills/agent-chorus
        run: bash ./test-standalone.sh
