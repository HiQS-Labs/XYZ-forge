# GH-388 — the ONE place the harness states which storage it will not trust with evidence.
#
# Read at runtime by BOTH lanes, so there is no second copy to drift:
#   Bash   relay-automation/durable-log-lib.sh :: xyz_path_is_durable
#   Python utils/py/rtl.py                     :: path_is_durable
#
# This is a data file rather than a constant in each language on purpose. The Litmus review of #388
# found that "the repo's own PDDA lint already classifies these locations" was simply false — nothing
# stated them anywhere the harness reads. Two hardcoded lists would have been the same defect with an
# extra step: the failure this guards against is evidence quietly landing in storage that a reboot
# erases, and a stale second list is exactly how that returns.
#
# WHY THIS MATTERS, from the run that produced the issue: a marathon on a 32 GB host panicked the
# machine during phase 5. Phases 1-4 had transcripts; phase 5 — the one that killed the host — had
# none, and the only surviving account was a terminal stream redirected to a path the platform clears
# at boot. After the reboot it was gone. The harness had offered no alternative and given no
# indication one was needed.
#
# FORMAT: one absolute path prefix per line. Blank lines and #-comments ignored. A path is
# non-durable if it IS one of these or lives underneath one. Matching is on the REAL path
# (symlinks resolved) — on macOS /tmp is a symlink to /private/tmp, and matching the logical form
# alone would let the same directory pass under its other name.
#
# $TMPDIR is deliberately NOT listed here as a literal: it is a variable, and a file cannot hold its
# value. Both readers add the live value of TMPDIR to this list at runtime. That is also why an
# entry like /var/folders is present — it is where macOS actually points TMPDIR, and it survives
# the case where TMPDIR is unset in the environment the harness inherits.

/tmp
/private/tmp
/var/tmp
/private/var/tmp

# macOS per-user temporary directories (`getconf DARWIN_USER_TEMP_DIR`). Cleared on reboot, and the
# specific location the GH-382 panic run's evidence was written to and lost.
/var/folders
/private/var/folders

# Linux tmpfs mounts — RAM-backed, gone on reboot.
/dev/shm
/run/user
