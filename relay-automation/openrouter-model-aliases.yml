# OpenRouter model-name lookup table (GH-120).
#
# Maps a colloquial/short model name to its canonical OpenRouter `provider/slug[:variant]` id, so
# relay-automation tooling can resolve a name like "GLM 5.2" or "Nemotron Ultra 3" without a live
# query against https://openrouter.ai/api/v1/models every time.
#
# Format: one entry per line, `alias: canonical-slug`. Resolution is fuzzy (see the lookup helper
# this lane adds) — normalize case/punctuation/hyphens before matching against these keys.
#
# TODO(GH-120): seed with the models tested so far (GLM 5.2 -> z-ai/glm-5.2,
# Nemotron Ultra 3 -> nvidia/nemotron-3-ultra-550b-a55b, and its free variant),
# using the "alias: canonical-slug" format described above.
